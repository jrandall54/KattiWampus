name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Compile Java
        run: |
          if [ -f KattiWampus.java ]; then javac KattiWampus.java; fi
      - name: Run tests script
        run: |
          chmod +x ./scripts/run_tests.sh || true
          ./scripts/run_tests.sh || true
